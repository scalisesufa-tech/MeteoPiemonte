server:
  port: 8080

spring:
  application:
    name: meteo-core
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/meteo
    username: meteo
    password: meteo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

meteo:
  torinometeo:
    realtimeUrl: "https://torinometeo.org/api/v1/realtime/data/"
  openmeteo:
    realtimeUrlTemplate: "https://api.open-meteo.com/v1/forecast?latitude=%s&longitude=%s&current=temperature_2m,relative_humidity_2m,surface_pressure"
  polling:
    realtimeMs: 3600000
  publish:
    enabled: true
  cache:
    maxAgeMinutes: 90
  remote:
    timeoutMs: 10000
  rate-limit:
    permitsPerMinute: 6
  backoff:
    minutes: 30
  circuit-breaker:
    failureThreshold: 3
    waitOpenMinutes: 30
