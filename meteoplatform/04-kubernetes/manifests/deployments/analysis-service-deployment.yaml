apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: group-6
  labels:
    app: analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      containers:
      - name: analysis-service
        image: REPLACE_ME_REGISTRY/analysis-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: QUEUE_NAME
          value: meteo.realtime
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
