server:
  port: 8080

spring:
  application:
    name: meteo-core
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    url: jdbc:postgresql://localhost:5432/meteo
    username: meteo
    password: meteo

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

meteo:
  torinometeo:
    realtimeUrl: "https://www.torinometeo.org/api/v1/realtime/data/"
    historyUrlTemplate: "https://www.torinometeo.org/api/v1/realtime/history/{year}/{month}/{day}/"
  polling:
    realtimeMs: 900000
  publish:
    enabled: true
