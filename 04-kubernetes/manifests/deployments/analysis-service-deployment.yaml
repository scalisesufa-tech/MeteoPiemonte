apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: group-6
  labels:
    app: analysis-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-service
  template:
    metadata:
      labels:
        app: analysis-service
    spec:
      containers:
      - name: analysis-service
        image: scalisufa/analysis-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: QUEUE_NAME
          value: meteo.realtime
        - name: CORE_API_BASE
          value: http://meteo-core:8080
        - name: REDIS_URL
          value: redis://redis:6379/0
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
