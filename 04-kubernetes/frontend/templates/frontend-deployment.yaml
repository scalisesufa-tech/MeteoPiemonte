apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ include "frontend.fullname" . }}'
  labels:
    app: '{{ include "frontend.fullname" . }}'
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: '{{ include "frontend.fullname" . }}'
  template:
    metadata:
      labels:
        app: '{{ include "frontend.fullname" . }}'
    spec:
      containers:
      - name: '{{ include "frontend.fullname" . }}'
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REACT_APP_CORE_BASE
          value: /group-6/core
        - name: REACT_APP_ANALYSIS_BASE
          value: /group-6/analysis
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
