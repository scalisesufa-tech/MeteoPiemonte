apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "meteo-db.fullname" . }}
  labels:
    app: {{ include "meteo-db.fullname" . }}
spec:
  serviceName: {{ include "meteo-db.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "meteo-db.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "meteo-db.fullname" . }}
    spec:
      containers:
      - name: timescaledb
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: meteo-db-secret
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U $(POSTGRES_USER) -d $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: init
        configMap:
          name: meteo-db-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: csi-cinder-fast
      resources:
        requests:
          storage: 10Gi
