apiVersion: v1
kind: Service
metadata:
  name: {{ include "meteo-db.fullname" . }}
  labels:
    {{- include "meteo-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 5432 }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "meteo-db.selectorLabels" . | nindent 4 }}
