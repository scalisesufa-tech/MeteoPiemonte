apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ include "grafana.fullname" . }}'
  labels:
    app: '{{ include "grafana.fullname" . }}'
spec:
  strategy:
    type: Recreate
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: '{{ include "grafana.fullname" . }}'
  template:
    metadata:
      labels:
        app: '{{ include "grafana.fullname" . }}'
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
      - name: '{{ include "grafana.fullname" . }}'
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - secretRef:
            name: grafana-admin-secret
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: provisioning
          mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
          subPath: dashboard.yml
          readOnly: true
        - name: provisioning
          mountPath: /etc/grafana/provisioning/datasources/datasource.yml
          subPath: datasource.yml
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: provisioning
        configMap:
          name: grafana-provisioning
