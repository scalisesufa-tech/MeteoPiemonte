apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels:
    {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.ports.amqp | default 5672 }}
      targetPort: amqp
      protocol: TCP
      name: amqp
    - port: {{ .Values.service.ports.mgmt | default 15672 }}
      targetPort: mgmt
      protocol: TCP
      name: mgmt
  selector:
    {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
