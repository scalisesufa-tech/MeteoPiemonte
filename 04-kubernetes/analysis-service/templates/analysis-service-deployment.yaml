apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "analysis-service.fullname" . }}
  labels:
    {{- include "analysis-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "analysis-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "analysis-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RABBITMQ_URL
              value: {{ required "env.RABBITMQ_URL is required" .Values.env.RABBITMQ_URL | quote }}
            - name: QUEUE_NAME
              value: {{ required "env.QUEUE_NAME is required" .Values.env.QUEUE_NAME | quote }}
            - name: CORE_API_BASE
              value: {{ required "env.CORE_API_BASE is required" .Values.env.CORE_API_BASE | quote }}
            - name: REDIS_URL
              value: {{ required "env.REDIS_URL is required" .Values.env.REDIS_URL | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 10 }}
