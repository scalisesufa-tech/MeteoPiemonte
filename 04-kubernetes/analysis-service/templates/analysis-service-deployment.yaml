apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "analysis-service.fullname" . }}
  labels:
    app: {{ include "analysis-service.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "analysis-service.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "analysis-service.fullname" . }}
    spec:
      containers:
      - name: {{ include "analysis-service.fullname" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: RABBITMQ_URL
          value: amqp://guest:guest@rabbitmq:5672/
        - name: QUEUE_NAME
          value: meteo.realtime
        - name: CORE_API_BASE
          value: http://meteo-core:8080
        - name: REDIS_URL
          value: redis://redis:6379/0
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
