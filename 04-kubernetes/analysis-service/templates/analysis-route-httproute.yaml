{{- if .Values.route.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "analysis-service.fullname" . }}-route
  labels:
    {{- include "analysis-service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName | default "shared-gateway" }}
      namespace: {{ .Values.route.gatewayNamespace | default "default" }}
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix | default "/group-6/analysis" }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "analysis-service.fullname" . }}
          port: {{ .Values.service.port | default 8000 }}
          weight: 1
{{- end }}
